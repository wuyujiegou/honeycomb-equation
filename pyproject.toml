[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeycomb-v0-prototype"
version = "0.2.1"
description = "Honeycomb Equation reconstructed closed-loop executable reference semantics"
readme = "README.md"
authors = [{name = "Zhang Bingchao", email = "sanhun2020@outlook.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
he-selfcheck = "honeycomb_v0.install_cli:selfcheck_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honeycomb_v0 = ["data/**/*.json"]
